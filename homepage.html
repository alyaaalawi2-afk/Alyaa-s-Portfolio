<style>

	body{
    text-align:center;
    font-family:Arial, sans-serif;
    margin-top:100px;
    background-color:maroon;
}


/* Main Title */

h1{
    color:pink;
    font-size:45px;
    text-shadow:0px 0px 15px rgba(255,192,203,0.8);
}


h2{
    color:white;
}



/* Cute Modern Buttons */

button{

    width:200px;
    height:65px;

    margin:15px;

    border:none;
    border-radius:35px;

    background:linear-gradient(135deg,#ff9a9e,#fad0c4);

    color:#5c1a1a;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:all 0.4s ease;

    box-shadow:
    0 8px 15px rgba(0,0,0,0.3);

}



/* When mouse touches button */

button:hover{

    transform:
    translateY(-10px)
    scale(1.08);

    background:
    linear-gradient(135deg,#fbc2eb,#a6c1ee);

    color:white;

    box-shadow:
    0 15px 25px rgba(255,182,193,0.6);

}



/* When clicked */

button:active{

    transform:scale(0.95);

}



/* Button container */

.menu{

    margin-top:50px;

}
    
</style>
